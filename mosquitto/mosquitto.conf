# /etc/mosquitto/conf.d/smartbox.conf – broker sulla smartbox (topologia A, tesi §3.7)
per_listener_settings true

# solo rete locale, TLS (tesi §3.13.4)
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# per prove di laboratorio senza TLS, decommentare (MAI su strada):
# listener 1883
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/acl

# sessioni persistenti: eventi conservati per i sottoscrittori temporaneamente disconnessi
persistence true
persistence_location /var/lib/mosquitto/
